<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="350" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">
    UK Resident Expenditure Allocation by Age Group (2004)
  </text>
  <line x1="80" y1="320" x2="650" y2="320" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="80" y1="60" x2="80" y2="320" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Y-Axis labels -->
  <text x="70" y="325" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">0%</text>
  <text x="70" y="260" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">5%</text>
  <text x="70" y="195" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">10%</text>
  <text x="70" y="130" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">15%</text>
  <text x="70" y="65" text-anchor="end" font-family="sans-serif" font-size="11" fill="#64748b">25%</text>

  <!-- Group 1: Under 30 -->
  <rect x="110" y="242" width="22" height="78" fill="#3b82f6" rx="2"/>
  <rect x="136" y="138" width="22" height="182" fill="#10b981" rx="2"/>
  <rect x="162" y="229" width="22" height="91" fill="#f59e0b" rx="2"/>
  <text x="147" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">Under 30</text>

  <!-- Group 2: 31-45 -->
  <rect x="220" y="203" width="22" height="117" fill="#3b82f6" rx="2"/>
  <rect x="246" y="182" width="22" height="138" fill="#10b981" rx="2"/>
  <rect x="272" y="216" width="22" height="104" fill="#f59e0b" rx="2"/>
  <text x="257" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">31–45</text>

  <!-- Group 3: 46-60 -->
  <rect x="330" y="151" width="22" height="169" fill="#3b82f6" rx="2"/>
  <rect x="356" y="208" width="22" height="112" fill="#10b981" rx="2"/>
  <rect x="382" y="138" width="22" height="182" fill="#f59e0b" rx="2"/>
  <text x="367" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">46–60</text>

  <!-- Group 4: 61-75 -->
  <rect x="440" y="86" width="22" height="234" fill="#3b82f6" rx="2"/>
  <rect x="466" y="294" width="22" height="26" fill="#10b981" rx="2"/>
  <rect x="492" y="60" width="22" height="260" fill="#f59e0b" rx="2"/>
  <text x="477" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">61–75</text>

  <!-- Group 5: 76+ -->
  <rect x="550" y="60" width="22" height="260" fill="#3b82f6" rx="2"/>
  <rect x="576" y="229" width="22" height="91" fill="#10b981" rx="2"/>
  <rect x="602" y="151" width="22" height="169" fill="#f59e0b" rx="2"/>
  <text x="587" y="340" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="600" fill="#334155">76 &amp; over</text>

  <!-- Legend -->
  <g transform="translate(180, 370)">
    <rect x="0" y="0" width="14" height="14" fill="#3b82f6" rx="2"/>
    <text x="20" y="11" font-family="sans-serif" font-size="11" fill="#475569">Food &amp; Drink</text>
    <rect x="130" y="0" width="14" height="14" fill="#10b981" rx="2"/>
    <text x="150" y="11" font-family="sans-serif" font-size="11" fill="#475569">Restaurant &amp; Hotel</text>
    <rect x="290" y="0" width="14" height="14" fill="#f59e0b" rx="2"/>
    <text x="310" y="11" font-family="sans-serif" font-size="11" fill="#475569">Entertainment</text>
  </g>
</svg>